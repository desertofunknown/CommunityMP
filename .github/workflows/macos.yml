name: Reusable MacOS workflow

on:
  workflow_call:
    inputs:
      build-type:
        default: RelWithDebInfo
        type: string
      image:
        description: MacOS Runner image
        required: true
        type: string

jobs:
  MacOS:
    name: ${{ inputs.image }}
    runs-on: ${{ inputs.image }}
    steps:
    - uses: actions/checkout@v4
    - run: echo "CMAKE_BUILD_TYPE=${{ inputs.build-type }}" >> $GITHUB_ENV

    - run: echo "MACOS_AMD64=true" >> $GITHUB_ENV
      if: ${{ inputs.image == 'macos-15-intel' }}

    - run: echo "DMG_IDENTIFIER=x86_64" >> $GITHUB_ENV
      if: ${{ inputs.image == 'macos-15-intel' }}
    - run: echo "DMG_IDENTIFIER=arm64" >> $GITHUB_ENV
      if: ${{ inputs.image != 'macos-15-intel' }}

    - name: Install Building Dependencies
      run: CI/before_install.macos.sh

    - name: Prepare TES3MP GNS dependencies
      run: |
        git clone --depth 1 https://github.com/microsoft/vcpkg.git deps/vcpkg-gns
        ./deps/vcpkg-gns/bootstrap-vcpkg.sh -disableMetrics
        # static, like the Linux build: a dynamic GNS leaves the app bundle
        # referencing @rpath/libGameNetworkingSockets.dylib, which CPack's
        # fixup_bundle cannot resolve to anything inside the bundle
        if [[ "${MACOS_AMD64}" ]]; then
          triplet=x64-osx
        else
          triplet=arm64-osx
        fi
        ./deps/vcpkg-gns/vcpkg install gamenetworkingsockets --triplet "$triplet"
        echo "GNS_VCPKG_ROOT=${{ github.workspace }}/deps/vcpkg-gns" >> $GITHUB_ENV
        echo "GNS_VCPKG_TRIPLET=$triplet" >> $GITHUB_ENV

    - name: Prime ccache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        key: ${{ inputs.image }}-${{ inputs.build-type }}
        max-size: 1000M

    - name: Configure
      run: CI/before_script.macos.sh -C
    - name: Build
      run: CI/macos/build.sh

    - name: Store dmg
      uses: actions/upload-artifact@v4
      with:
        name: openmw-macos-dmg-${{ env.DMG_IDENTIFIER }}-${{ github.sha }}
        path: |
          ${{ github.workspace }}/build/OpenMW-*.dmg

    - name: Create prerelease
      if: ${{ inputs.build-type == 'Release' }}
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ github.workspace }}/build/OpenMW-*.dmg
        prerelease: true
        draft: true
