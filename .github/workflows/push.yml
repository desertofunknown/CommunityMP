name: Build and test

on:
- push
- pull_request

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  Ubuntu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add OpenMW PPA Dependencies
      run: sudo add-apt-repository ppa:openmw/openmw; sudo apt-get update

    - name: Install Building Dependencies
      run: |
        sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic
        # CMakeLists.txt requires the Boost filesystem component, which the
        # openmw-deps group does not install
        sudo apt-get install -y --no-install-recommends libboost-filesystem-dev
        # the Hub is a Tauri app and BUILD_COMMUNITYMP_HUB defaults to ON, so
        # its GTK/WebKit build dependencies are needed here too
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
          librsvg2-dev libxdo-dev libssl-dev

    - name: Prepare TES3MP GNS dependencies
      run: |
        git clone --depth 1 https://github.com/microsoft/vcpkg.git deps/vcpkg-gns
        ./deps/vcpkg-gns/bootstrap-vcpkg.sh -disableMetrics
        # no boost-asio/boost-iostreams here: vcpkg would put Boost 1.92 on
        # CMAKE_PREFIX_PATH, and its BoostConfig.cmake then demands every
        # component at exactly 1.92 while Ubuntu provides 1.83
        ./deps/vcpkg-gns/vcpkg install gamenetworkingsockets --triplet x64-linux

    - name: Prime ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ matrix.os }}-${{ env.BUILD_TYPE }}
        max-size: 1000M

    - name: Configure
      run: >
        cmake .
        -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -D OPENMW_USE_SYSTEM_RECASTNAVIGATION=ON
        -D OPENMW_USE_SYSTEM_BULLET=OFF
        -D "CMAKE_MAP_IMPORTED_CONFIG_RELWITHDEBINFO=RelWithDebInfo;Release;None;"
        -D USE_SYSTEM_TINYXML=ON
        -D BUILD_COMPONENTS_TESTS=ON
        -D BUILD_OPENMW_TESTS=ON
        -D BUILD_OPENCS_TESTS=ON
        -D BUILD_TES3MP_CLIENT=ON
        -D BUILD_TES3MP_SERVER=ON
        -D BUILD_TES3MP_BROWSER=ON
        -D BUILD_TES3MP_MASTER=ON
        -D CMAKE_PREFIX_PATH=${{ github.workspace }}/deps/vcpkg-gns/installed/x64-linux
        -D CMAKE_INSTALL_PREFIX=install

    - name: Build
      run: cmake --build . -- -j$(nproc)

    - name: Run components tests
      run: ./components-tests

    - name: Run OpenMW tests
      run: ./openmw-tests

    - name: Run OpenMW-CS tests
      run: ./openmw-cs-tests

    # - name: Install
    #   shell: bash
    #   run: cmake --install .

    # - name: Create Artifact
    #   shell: bash
    #   working-directory: install
    #   run: |
    #     ls -laR
    #     7z a ../build_artifact.7z .

    # - name: Upload Artifact
    #   uses: actions/upload-artifact@v1
    #   with:
    #     path: ./build_artifact.7z
    #     name: build_artifact.7z

  MacOS:
    strategy:
      # an Intel runner failing should not cancel the arm64 build: the two
      # platforms fail for unrelated reasons
      fail-fast: false
      matrix:
        args:
          - image: macos-15
          - image: macos-15-intel
    uses: ./.github/workflows/macos.yml
    with:
      image: ${{ matrix.args.image }}

  Windows:
    strategy:
      fail-fast: true
      matrix:
        image:
        - "2022"

    uses: ./.github/workflows/windows.yml
    with:
      image: ${{ matrix.image }}
